<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Join a group · Memo Everything</title>
<style>
  :root {
    --bg: #111015; --surface: #1b1a21; --line: #2c2934; --text: #f5f2f8;
    --muted: #b4adbf; --soft: #8a8394; --accent: #f4a98a; --accent-bg: #3b2924; --on-accent: #2b1610;
    color-scheme: dark light;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #fbf8f6; --surface: #ffffff; --line: #e9e2dd; --text: #1d1a20;
      --muted: #5c5560; --soft: #7d7580; --accent: #b4532c; --accent-bg: #fbe7de; --on-accent: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  .brand { color: var(--accent); font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
  h1 { font-size: 28px; line-height: 1.25; margin: 10px 0 8px; }
  p { color: var(--muted); margin: 0 0 20px; }
  .code {
    background: var(--accent-bg); border-radius: 20px; padding: 18px; margin: 0 0 24px;
    font: 600 34px/1.2 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .25em;
  }
  .button {
    display: block; padding: 15px 20px; border-radius: 999px; text-decoration: none;
    background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 17px;
  }
  .secondary { display: inline-block; margin-top: 16px; color: var(--accent); }
  .note { font-size: 14px; color: var(--soft); margin-top: 24px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="brand" lang="en">Memo Everything</div>
  <h1 data-text="title"></h1>
  <p data-text="body"></p>
  <div class="code" id="code" aria-live="polite"></div>
  <a class="button" id="open" href="#" data-text="open"></a>
  <a class="secondary" id="store" href="https://play.google.com/store/apps/details?id=com.memoeverything.app" data-text="store"></a>
  <p class="note" data-text="note"></p>
</main>
<script>
  const texts = {
    en: {
      title: "You’re invited to rehearse",
      body: "Open Memo Everything to join the group and take your roles.",
      open: "Open in the app",
      store: "Get the app on Google Play",
      note: "If the app doesn’t open, install it, then choose Ensemble rehearsal › Join with a code and type the code above.",
      missing: "This invite link has no code. Ask for the code and type it in the app."
    },
    tr: {
      title: "Provaya davet edildin",
      body: "Gruba katılıp rollerini seçmek için Memo Everything’i aç.",
      open: "Uygulamada aç",
      store: "Uygulamayı Google Play’den indir",
      note: "Uygulama açılmazsa önce yükle, sonra Ekip provası › Kodla katıl’ı seçip yukarıdaki kodu yaz.",
      missing: "Bu davet linkinde kod yok. Kodu isteyip uygulamaya yaz."
    }
  };
  const t = texts[(navigator.language || "en").toLowerCase().startsWith("tr") ? "tr" : "en"];
  document.documentElement.lang = t === texts.tr ? "tr" : "en";
  document.querySelectorAll("[data-text]").forEach(el => { el.textContent = t[el.dataset.text]; });

  const raw = new URLSearchParams(location.search).get("c") || "";
  const code = raw.toUpperCase().replace(/[^A-Z0-9]/g, "");
  const open = document.getElementById("open");
  const codeBox = document.getElementById("code");
  if (/^[A-Z0-9]{6}$/.test(code)) {
    codeBox.textContent = code;
    const store = "https://play.google.com/store/apps/details?id=com.memoeverything.app";
    // Android opens the app, or Google Play when the app is not installed.
    open.href = /android/i.test(navigator.userAgent)
      ? "intent://join/" + code + "#Intent;scheme=memoeverything;package=com.memoeverything.app;S.browser_fallback_url="
        + encodeURIComponent(store) + ";end"
      : "memoeverything://join/" + code;
  } else {
    codeBox.hidden = true;
    open.hidden = true;
    document.querySelector("[data-text=body]").textContent = t.missing;
  }
</script>
</body>
</html>
