# Memo Everything studio voices: the Gemini key lives here as a secret, never in the apps.
# Deployed by .github/workflows/worker.yml; GEMINI_API_KEY is set from the GitHub secret.
name = "memo-studio"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
FIREBASE_PROJECT_ID = "memo-70a45"
# Once the store products exist ("memo_premium" subscription and the one-time "memo_extra_script"
# on both stores), set ENFORCE_PURCHASES = "true" and MONTHLY_SCRIPTS = "2": then only Premium
# users get studio voices, with extra scripts bought one at a time.
ENFORCE_PURCHASES = "false"
ANDROID_PACKAGE = "com.memoeverything.app"
IOS_BUNDLE = "com.memoeverything.app"
# Each calendar month (UTC) a user may prepare studio voices for this many scripts...
# While testing there is no practical limit; the planned allowance is "2".
MONTHLY_SCRIPTS = "1000"
# ...and, as a cost guard, direct and voice at most this many lines in all.
# Raised while testing; planned: 3000 directed and 2000 spoken.
MONTHLY_DIRECTED_LINES = "50000"
MONTHLY_SPOKEN_LINES = "30000"

# One small SQLite-backed Durable Object per user keeps the monthly counts (free plan).
[[durable_objects.bindings]]
name = "QUOTA"
class_name = "Quota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Quota"]
