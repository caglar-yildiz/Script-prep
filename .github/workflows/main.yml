name: Build Play Store bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: play-signing
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Build release bundle
        env:
          # Every upload to Google Play needs a larger version code than the last one.
          VERSION_CODE: ${{ 100 + github.run_number }}
        run: ./gradlew --no-daemon :app:testReleaseUnitTest :app:bundleRelease

      - name: Sign bundle with the Play upload key
        env:
          # The play-signing environment stores the upload key under the RELEASE_* names.
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${PLAY_UPLOAD_KEYSTORE_BASE64:?Set RELEASE_KEYSTORE_BASE64 in the play-signing environment}"
          : "${PLAY_UPLOAD_STORE_PASSWORD:?Set RELEASE_KEYSTORE_PASSWORD in the play-signing environment}"
          : "${PLAY_UPLOAD_KEY_ALIAS:?Set RELEASE_KEY_ALIAS in the play-signing environment}"
          : "${PLAY_UPLOAD_KEY_PASSWORD:?Set RELEASE_KEY_PASSWORD in the play-signing environment}"

          keystore=$(mktemp "$RUNNER_TEMP/play-upload.XXXXXX")
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          jarsigner -keystore "$keystore" \
            -storepass:env PLAY_UPLOAD_STORE_PASSWORD \
            -keypass:env PLAY_UPLOAD_KEY_PASSWORD \
            -signedjar Memo-Everything-release.aab \
            app/build/outputs/bundle/release/app-release.aab "$PLAY_UPLOAD_KEY_ALIAS"
          jarsigner -verify Memo-Everything-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: Memo-Everything-release
          path: Memo-Everything-release.aab
          if-no-files-found: error
          retention-days: 14
