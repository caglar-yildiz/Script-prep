name: Android APK

on:
  push:
    paths:
      - '.github/workflows/android-apk.yml'
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          # Keeps downloaded Gradle dependencies between runs, so builds rarely need Maven Central.
          cache: gradle

      - name: Ensure Android SDK packages are installed
        run: |
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          if [[ ! -f "$sdk_root/platforms/android-36/android.jar" || ! -x "$sdk_root/build-tools/36.0.0/apksigner" ]]; then
            "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Build and verify APK
        run: |
          # Dependency downloads occasionally fail on CI runners; try once more before giving up.
          ./gradlew --no-daemon --stacktrace :app:assembleDebug || ./gradlew --no-daemon --stacktrace --refresh-dependencies :app:assembleDebug
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -Fx "targetSdkVersion:'36'"
          cp app/build/outputs/apk/debug/app-debug.apk Memo-Everything.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Memo-Everything
          path: Memo-Everything.apk
          if-no-files-found: error
          retention-days: 30
