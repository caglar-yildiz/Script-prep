name: Release bundle

# Builds the signed Android App Bundle (AAB) for Google Play.
# Push a tag such as v0.3.0, or start it by hand from the Actions tab.
#
# Secrets of the play-signing environment (Settings > Environments > play-signing):
#   RELEASE_KEYSTORE_BASE64   upload keystore, base64-encoded
#   RELEASE_KEYSTORE_PASSWORD keystore password
#   RELEASE_KEY_ALIAS         key alias inside the keystore
#   RELEASE_KEY_PASSWORD      key password

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name shown in the store, for example 0.3.0'
        required: true

permissions:
  contents: read

jobs:
  bundle:
    name: Build signed release bundle
    runs-on: ubuntu-24.04
    # The upload key's secrets are stored in this environment.
    environment: play-signing
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          # Keeps downloaded Gradle dependencies between runs, so builds rarely need Maven Central.
          cache: gradle

      - name: Ensure Android SDK packages are installed
        run: |
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          if [[ ! -f "$sdk_root/platforms/android-36/android.jar" || ! -x "$sdk_root/build-tools/36.0.0/apksigner" ]]; then
            "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Restore the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Add the RELEASE_KEYSTORE_BASE64 secret before building a release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Work out the version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version_name }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          # Every upload to Google Play needs a larger version code than the last one.
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build the bundle
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # Dependency downloads occasionally fail on CI runners; try once more before giving up.
          ./gradlew --no-daemon --stacktrace :app:bundleRelease || ./gradlew --no-daemon --stacktrace --refresh-dependencies :app:bundleRelease
          bundle="app/build/outputs/bundle/release/app-release.aab"
          jarsigner -verify "$bundle" | grep -q "jar verified" || { echo "::error::The bundle is not signed."; exit 1; }
          cp "$bundle" "Memo-Everything-$VERSION_NAME-$VERSION_CODE.aab"

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: Memo-Everything-release-${{ env.VERSION_NAME }}
          path: Memo-Everything-*.aab
          if-no-files-found: error
          retention-days: 90
