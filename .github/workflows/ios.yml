name: iOS app

on:
  push:
    paths:
      - '.github/workflows/ios.yml'
      - 'ios/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Test the shared text rules
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Run the MemoCore tests
        working-directory: ios/MemoCore
        run: swift test

  build:
    name: Build the iPhone app
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check the translations and icons are up to date
        run: |
          python3 ios/scripts/convert_resources.py
          git diff --exit-code -- ios/MemoEverything/Resources

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ hashFiles('ios/project.yml') }}

      - name: Build for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project MemoEverything.xcodeproj -scheme MemoEverything \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Take screenshots in the simulator
        working-directory: ios
        run: |
          set -x
          app=$(find ~/Library/Developer/Xcode/DerivedData -path '*Debug-iphonesimulator/MemoEverything.app' -type d | head -1)
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys
          d=json.load(sys.stdin)["devices"]
          print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device"
          xcrun simctl install "$device" "$app"
          mkdir -p screenshots
          for screen in home categories editor setup rehearsal settings premium; do
            xcrun simctl terminate "$device" com.memoeverything.app || true
            xcrun simctl launch "$device" com.memoeverything.app -AppleLanguages "(tr)" -demo "$screen"
            sleep 6
            xcrun simctl io "$device" screenshot "screenshots/$screen.png"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ios/screenshots
          retention-days: 14

      - name: Build an unsigned iPhone app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project MemoEverything.xcodeproj -scheme MemoEverything \
            -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath build -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tee device.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" device.log
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MemoEverything.app Payload/
          zip -qr Memo-Everything-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Memo-Everything-iOS-unsigned
          path: ios/Memo-Everything-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: ios/*.log
          retention-days: 7
